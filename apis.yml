name: Huddl
description: Huddl (huddl.ai) was an AI meeting-collaboration platform founded in 2017
  in Mountain View, California by CEO Krishna Yarlagadda and CTO Nava Davuluri. The product
  acted as a collaboration hub layered over Zoom, Webex, and Microsoft Teams, using automatic
  speech recognition to turn meeting audio into searchable text alongside real-time
  collaborative note-taking and AI-generated meeting summaries. The company raised roughly
  $8.7M in venture funding. As of this enrichment pass the huddl.ai domain no longer
  resolves (delegated to Namecheap parking nameservers with no A/AAAA/MX/TXT records),
  indicating the service is discontinued; no public API, developer portal, OpenAPI,
  or GitHub organization could be located.
